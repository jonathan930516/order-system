<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>ORDER // SYSTEM</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px;
    background: #06111f;
    color: #eaf6ff;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
}

.container {
    max-width: 1000px;
    margin: auto;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

h1 {
    letter-spacing: 4px;
}

.online {
    color: #50ffc8;
}

.panel {
    border: 1px solid #23658b;
    border-radius: 18px;
    padding: 26px;
    margin-top: 20px;
    background: #0b1e33;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

label {
    display: block;
    color: #5bd8ff;
    margin-bottom: 7px;
}

input, select, textarea {
    width: 100%;
    padding: 13px;
    border-radius: 9px;
    border: 1px solid #24658a;
    background: #071625;
    color: white;
    font-size: 16px;
}

textarea {
    min-height: 90px;
}

.full {
    grid-column: 1 / 3;
}

.bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 25px;
}

.total {
    color: #20d8ff;
    font-size: 30px;
}

button {
    background: #25c7ed;
    border: 0;
    padding: 14px 24px;
    border-radius: 9px;
    font-size: 16px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div>
            <h1>ORDER // SYSTEM</h1>
            <p>科技感訂單管理介面</p>
        </div>

        <div class="online">● SYSTEM ONLINE</div>
    </div>

    <form action="order" method="post">

        <div class="panel">

            <div class="grid">

                <div>
                    <label>訂單編號</label>
                    <input type="text"
                           value="系統自動產生"
                           readonly>
                </div>

                <div>
                    <label>客戶姓名</label>
                    <input type="text"
                           name="customer"
                           required>
                </div>

                <div>
                    <label>商品</label>
                    <select name="product" id="product">
                        <option value="科技鍵盤">科技鍵盤 NT$1,290</option>
                        <option value="無線滑鼠">無線滑鼠 NT$890</option>
                        <option value="電競耳機">電競耳機 NT$2,990</option>
                        <option value="智慧螢幕">智慧螢幕 NT$4,990</option>
                    </select>
                </div>

                <div>
                    <label>數量</label>
                    <input type="number"
                           name="qty"
                           id="qty"
                           value="1"
                           min="1">
                </div>

                <div>
                    <label>付款方式</label>
                    <select name="payment">
                        <option value="信用卡">信用卡</option>
                        <option value="現金">現金</option>
                        <option value="轉帳">轉帳</option>
                    </select>
                </div>

                <div>
                    <label>訂單狀態</label>
                    <select name="status">
                        <option value="處理中">處理中</option>
                        <option value="已付款">已付款</option>
                        <option value="已完成">已完成</option>
                    </select>
                </div>

                <div class="full">
                    <label>備註</label>
                    <textarea name="note"
                              placeholder="輸入訂單備註..."></textarea>
                </div>

            </div>

            <div class="bottom">
                <div class="total" id="total">NT$1,290</div>
                <button type="submit">建立訂單</button>
            </div>

        </div>

    </form>

</div>

<script>
const prices = {
    "科技鍵盤": 1290,
    "無線滑鼠": 890,
    "電競耳機": 2990,
    "智慧螢幕": 4990
};

const product = document.getElementById("product");
const qty = document.getElementById("qty");
const total = document.getElementById("total");

function updateTotal() {
    const price = prices[product.value];
    const quantity = parseInt(qty.value) || 1;

    total.textContent =
        "NT$" + (price * quantity).toLocaleString();
}

product.addEventListener("change", updateTotal);
qty.addEventListener("input", updateTotal);
</script>

</body>
</html>
